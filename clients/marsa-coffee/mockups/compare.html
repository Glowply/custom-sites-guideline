<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marsa: three directions</title>
<style>
  :root { --bg: #1b1917; --panel: #26231f; --line: #3a352f; --text: #efe8dc; --muted: #a89c8c; --amber: #d08a45; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; color: var(--muted); border: 0; padding: 6px 12px; font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: inset 0 -2px 0 var(--amber); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-inline-end: 1px solid var(--line); }
  .col:last-child { border-inline-end: 0; }
  .label { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; }
  .desc { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage { flex: 1; overflow: hidden; background: #0f0e0d; }
  .box { position: relative; overflow: hidden; margin: 0 auto; }
  iframe { position: absolute; top: 0; left: 0; border: 0; background: #fff; transform-origin: 0 0; }
  .phone .box { margin-block: 14px; border-radius: 20px; box-shadow: 0 0 0 1px var(--line), 0 18px 36px -18px #000; }
</style>
</head>
<body>
<header>
  <h1>«مرسى» Marsa · three home page directions</h1>
  <div class="seg" role="group" aria-label="Viewport">
    <button type="button" data-vp="desktop" aria-pressed="true">Desktop 1440</button>
    <button type="button" data-vp="phone" aria-pressed="false">Phone 390</button>
  </div>
</header>
<main>
  <section class="col"><div class="label"><select aria-label="Left version"></select><span class="desc"></span></div><div class="stage"><div class="box"><iframe title="Left"></iframe></div></div></section>
  <section class="col"><div class="label"><select aria-label="Right version"></select><span class="desc"></span></div><div class="stage"><div class="box"><iframe title="Right"></iframe></div></div></section>
</main>
<script>
  const versions = [
    { id: 'd1', name: '1 · Drawer Wall «حيطة الأدراج»', src: 'direction-1/index.html', desc: 'The attar’s wall of drawers behind the counter; pick by how you brew' },
    { id: 'd2', name: '2 · Roast Calendar «نتيجة التحميص»', src: 'direction-2/index.html', desc: 'A tear-off wall calendar; the next roast day is the hero' },
    { id: 'd3', name: '3 · Overprint «طبعة على الكرافت»', src: 'direction-3/index.html', desc: 'Printed like the bag: kraft, navy ink, the red date sticker' },
  ];
  const sizes = { desktop: 1440, phone: 390 };
  let vp = 'desktop';
  const cols = [...document.querySelectorAll('.col')];
  const params = new URLSearchParams(location.search);
  const initial = [params.get('l') || 'd1', params.get('r') || 'd2'];
  cols.forEach((col, i) => {
    const sel = col.querySelector('select');
    versions.forEach(v => sel.add(new Option(v.name, v.id)));
    sel.value = initial[i];
    sel.addEventListener('change', () => load(col));
    col.querySelector('iframe').addEventListener('load', () => { fit(); setTimeout(fit, 900); });
    load(col);
  });
  function load(col) {
    const v = versions.find(x => x.id === col.querySelector('select').value);
    col.querySelector('.desc').textContent = v.desc;
    col.querySelector('iframe').src = v.src;
  }
  function fit() {
    const w = sizes[vp];
    cols.forEach(col => {
      const stage = col.querySelector('.stage'), box = col.querySelector('.box'), frame = col.querySelector('iframe');
      // The frame gets a real screen height and the page scrolls inside it, like a browser.
      // (Sizing the frame to the page's own height feeds back into pages that use vh units.)
      const s = Math.min(1, (stage.clientWidth - (vp === 'phone' ? 28 : 0)) / w);
      const avail = stage.clientHeight - (vp === 'phone' ? 28 : 0);
      const h = Math.round(avail / s);
      Object.assign(frame.style, { width: w + 'px', height: h + 'px', transform: `scale(${s})` });
      Object.assign(box.style, { width: w * s + 'px', height: h * s + 'px' });
      stage.classList.toggle('phone', vp === 'phone');
    });
  }
  document.querySelectorAll('[data-vp]').forEach(b => b.addEventListener('click', () => {
    vp = b.dataset.vp;
    document.querySelectorAll('[data-vp]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    fit(); setTimeout(fit, 400);
  }));
  addEventListener('resize', fit);
</script>
</body>
</html>
